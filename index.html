<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruta Viva</title>
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#35c86f">
</head>
<body>
    <p>Carregando Fruta Viva...</p>

    <script>
        (() => {
            const CHAVE_PERFIL = 'frutaVivaPerfil';

            function temPerfilConfigurado() {
                try {
                    const perfil = JSON.parse(localStorage.getItem(CHAVE_PERFIL) || '{}');

                    return Boolean(
                        perfil &&
                        typeof perfil === 'object' &&
                        !Array.isArray(perfil) &&
                        typeof perfil.avatar === 'string' &&
                        perfil.avatar.trim()
                    );
                } catch (erro) {
                    console.warn('Não foi possível verificar o perfil salvo.', erro);
                    return false;
                }
            }

            const destino = temPerfilConfigurado()
                ? 'tela-principal/principal.html'
                : 'tela-abertura/tela-abertura.html';

            window.location.replace(destino);
        })();
    </script>
</body>
</html>
