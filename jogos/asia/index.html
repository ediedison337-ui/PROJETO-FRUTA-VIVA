<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruta Viva - Mosaico das Frutas (Ásia)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <section id="start-screen" class="screen">
            <div class="start-card">
                <div class="asia-badge">🌏 ÁSIA</div>
                <h1>MOSAICO DAS FRUTAS</h1>
                <p class="mission-desc">“Monte a MANGA 🥭!”</p>
                
                <div class="preview-container">
                    <img src="imagens/manga.png" alt="Manga completa de referência" class="preview-img-full">
                </div>

                <button id="btn-start" type="button" class="primary-btn">COMEÇAR O DESAFIO</button>
            </div>
        </section>

        <div id="game-screen" class="screen hidden">
            <header class="game-header">
                <div class="hud-info">
                    <span class="hud-icon">🌏</span>
                    <div>
                        <h2>ÁSIA</h2>
                        <p>MOSAICO DA MANGA</p>
                    </div>
                </div>
                
                <div class="mini-ref-container" title="Referência da Manga">
                    <img src="imagens/manga.png" alt="Miniatura da Manga" class="mini-ref-img">
                </div>

                <button id="btn-reset" type="button" class="control-btn" title="Reiniciar">↻ Reiniciar</button>
            </header>

            <section class="progress-hud" aria-label="Progresso do Jogo">
                <div class="progress-label">
                    <span>Peças no lugar:</span>
                    <span id="progress-text">0 / 9</span>
                </div>
                <div class="tiles-indicator" id="tiles-indicator">
                    </div>
            </section>

            <main class="game-area">
                <div id="puzzle-board" class="puzzle-board" aria-label="Tabuleiro do Mosaico 3x3"></div>
            </main>

            <div id="aria-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
        </div>

        <div id="victory-screen" class="victory-modal hidden">
            <div class="victory-card">
                <div class="victory-header-icon">🎉</div>
                <h2>MOSAICO COMPLETO!</h2>
                <p>“Você montou a MANGA 🥭!”</p>

                <div class="victory-preview">
                    <img src="imagens/manga.png" alt="Manga Completa Montada" class="victory-img-full">
                </div>

                <button id="btn-quiz" type="button" class="primary-btn">RESPONDER QUIZ</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
